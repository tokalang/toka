name: Router package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKA_VERSION: v1.0.0-rc.1

jobs:
  qualify:
    name: qualify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS runtime dependency
        if: runner.os == 'macOS'
        run: brew install lld@20

      - name: Install pinned Toka SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="toka-${TOKA_VERSION}-${{ matrix.target }}.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/tokalang/toka/releases/download/${TOKA_VERSION}/${archive}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sdk="${RUNNER_TEMP}/toka-${TOKA_VERSION}-${{ matrix.target }}"
          printf 'TOKA=%s\n' "${sdk}/bin/toka" >> "$GITHUB_ENV"
          printf 'TOKAC=%s\n' "${sdk}/bin/tokac" >> "$GITHUB_ENV"
          printf 'TOKA_LIB=%s\n' "${sdk}/lib" >> "$GITHUB_ENV"

      - name: Qualify package
        run: python3 tests/qualify_package.py

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Toka SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="toka-${TOKA_VERSION}-linux-x64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/tokalang/toka/releases/download/${TOKA_VERSION}/${archive}"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sdk="${RUNNER_TEMP}/toka-${TOKA_VERSION}-linux-x64"
          printf 'TOKA=%s\n' "${sdk}/bin/toka" >> "$GITHUB_ENV"

      - name: Build release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          "$TOKA" publish
          archive="router-${version}.tar.gz"
          test -f "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
