name: Release Gate

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional release tag/version label
        required: false
        type: string
      publish_release:
        description: Publish archives to the named release after the gate passes
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    name: RC gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            os: linux
            arch: x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - name: macos-x64
            runner: macos-15-intel
            os: macos
            arch: x64
          - name: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake ninja-build lsb-release software-properties-common
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Resolve version label
        id: version
        shell: bash
        run: |
          set -euo pipefail
          label="${{ inputs.tag_name }}"
          if [ -z "$label" ]; then
            label="${{ github.ref_name }}"
          fi
          if [ -z "$label" ] || [ "$label" = "main" ]; then
            label="v0.9.9-01"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Configure compiler
        run: |
          set -euo pipefail
          release_version="${{ steps.version.outputs.label }}"
          release_version="${release_version#v}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTOKA_RELEASE_VERSION="$release_version" \
            ${LLVM_DIR:+-DLLVM_DIR="$LLVM_DIR"} \
            ${LLD_DIR:+-DLLD_DIR="$LLD_DIR"} \
            ${ZSTD_LIBRARY:+-DZSTD_LIBRARY="$ZSTD_LIBRARY"} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}

      - name: Run unified RC gate
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 tools/scripts/release_gate.py \
            --target "${{ matrix.name }}" \
            --version "${{ steps.version.outputs.label }}" \
            --work-dir "build/release-gate-work-${{ matrix.name }}" \
            --output "build/release-gate-${{ matrix.name }}.json"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ matrix.name }}
          path: |
            build/release-gate-${{ matrix.name }}.json
            build/release-gate-work-${{ matrix.name }}/logs
          if-no-files-found: error

      - name: Upload release archive
        if: success() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.label }}
          body_path: docs/release_notes_${{ steps.version.outputs.label }}.md
          files: build/toka-${{ steps.version.outputs.label }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
