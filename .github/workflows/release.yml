name: Release Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact immutable candidate SHA to qualify
        required: true
        type: string
      tag_name:
        description: Exact 0.11.x release label, for example v0.11.0
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  release-gate:
    name: Release gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            os: linux
            arch: x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - name: macos-x64
            runner: macos-15-intel
            os: macos
            arch: x64
          - name: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0

      - name: Verify exact source identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$CANDIDATE_REF"
          else
            [[ "$GITHUB_REF" =~ ^refs/tags/v0\.11\.(0|[1-9][0-9]*)$ ]]
            git rev-parse "$GITHUB_REF^{tag}" >/dev/null
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse HEAD)"
          fi

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake curl ninja-build lsb-release software-properties-common
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev pkg-config
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=/usr/lib/llvm-20/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-20/bin/clang++" >> "$GITHUB_ENV"
          export PATH="/usr/lib/llvm-20/bin:$PATH"
          echo "=== Linux LLVM 20 toolchain verification ==="
          which clang clang++
          /usr/lib/llvm-20/bin/clang --version
          /usr/lib/llvm-20/bin/clang++ --version

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Resolve version label
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v0\.11\.(0|[1-9][0-9]*)$ ]]; then
            echo "release label must be a canonical v0.11.x tag" >&2
            exit 1
          fi
          echo "label=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Configure compiler
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: |
          set -euo pipefail
          release_version="$VERSION_LABEL"
          release_version="${release_version#v}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTOKA_RELEASE_VERSION_OVERRIDE="$release_version" \
            ${LLVM_DIR:+-DLLVM_DIR="$LLVM_DIR"} \
            ${LLD_DIR:+-DLLD_DIR="$LLD_DIR"} \
            ${ZSTD_LIBRARY:+-DZSTD_LIBRARY="$ZSTD_LIBRARY"} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}

      - name: Run unified release gate
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET_NAME: ${{ matrix.name }}
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: |
          set -euo pipefail
          python3 tools/scripts/release_gate.py \
            --target "$TARGET_NAME" \
            --version "$VERSION_LABEL" \
            --work-dir "build/release-gate-work-$TARGET_NAME" \
            --output "build/release-gate-$TARGET_NAME.json"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ matrix.name }}
          path: |
            build/release-gate-${{ matrix.name }}.json
            build/taskhandle-lifecycle-conformance-${{ matrix.name }}.json
            build/toka-restricted-cancellation-${{ matrix.name }}.json
            build/unsafe-container-probe-*.jsonl
            build/release-gate-work-${{ matrix.name }}/logs
          if-no-files-found: error

      - name: Upload tagged archive artifact
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.name }}
          path: build/toka-${{ steps.version.outputs.label }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload unpublished candidate archive
        if: success() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-archive-${{ matrix.name }}
          path: build/toka-${{ steps.version.outputs.label }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  qualification-summary:
    name: Verify four-target qualification
    needs: release-gate
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}
          fetch-depth: 0

      - name: Verify exact source identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$CANDIDATE_REF"
          else
            [[ "$GITHUB_REF" =~ ^refs/tags/v0\.11\.(0|[1-9][0-9]*)$ ]]
            git rev-parse "$GITHUB_REF^{tag}" >/dev/null
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse HEAD)"
          fi

      - name: Resolve candidate identity
        id: candidate
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v0\.11\.(0|[1-9][0-9]*)$ ]]; then
            echo "release label must be a canonical v0.11.x tag" >&2
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "label=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all gate evidence
        if: always()
        run: mkdir -p qualification-evidence

      - name: Download all gate evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: release-gate-*
          path: qualification-evidence

      - name: Verify exact qualification reports
        if: always()
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          VERSION_LABEL: ${{ steps.candidate.outputs.label }}
        run: |
          python3 tools/scripts/verify_release_qualification.py \
            --evidence-dir qualification-evidence \
            --revision "$CANDIDATE_REVISION" \
            --version-label "$VERSION_LABEL" \
            --output build/release-qualification-summary.json

      - name: Upload qualification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-summary
          path: build/release-qualification-summary.json
          if-no-files-found: error

  create-draft-release:
    name: Create complete draft release
    needs: qualification-summary
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.qualification-summary.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve version label
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v0\.11\.(0|[1-9][0-9]*)$ ]]; then
            echo "release label must be a canonical v0.11.x tag" >&2
            exit 1
          fi
          echo "label=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all tagged archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: release-assets
          merge-multiple: true

      - name: Verify exact assets and write checksums
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: |
          python3 tools/scripts/verify_release_assets.py \
            --assets-dir release-assets \
            --version-label "$VERSION_LABEL" \
            --checksums-output release-assets/SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.label }}
          body_path: docs/release_notes_${{ steps.version.outputs.label }}.md
          draft: true
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
