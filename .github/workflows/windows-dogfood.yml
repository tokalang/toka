name: Native Windows Dogfood

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  change-scope:
    name: Classify change scope
    runs-on: ubuntu-22.04
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Windows qualification is required
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 tools/scripts/classify_ci_changes.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  sdk-dogfood:
    name: Windows/MSYS2 SDK path
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zstd

      - name: Build SDK
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/mingw64/lib/cmake/llvm \
            -DLLD_DIR=/mingw64/lib/cmake/lld
          cmake --build build --parallel 2

      - name: Exercise installed SDK and project workflow
        run: |
          set -euo pipefail
          python3 tools/scripts/test_developer_experience.py | tee build/windows-dogfood.json
          ctest --test-dir build --output-on-failure -R "^toka_async_"
          python3 tools/scripts/test_taskhandle_lifecycle.py
          python3 tools/scripts/test_restricted_cancellation_profile.py --conformance-output build/toka-restricted-cancellation-windows.json

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dogfood
          path: |
            build/windows-dogfood.json
            build/toka-restricted-cancellation-windows.json
          if-no-files-found: warn

  windows-gate:
    name: Windows gate result
    if: always()
    needs: [change-scope, sdk-dogfood]
    runs-on: ubuntu-22.04
    steps:
      - name: Require Windows only for compiler and SDK changes
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          HEAVY: ${{ needs.change-scope.outputs.heavy }}
          WINDOWS_RESULT: ${{ needs.sdk-dogfood.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$HEAVY" = true ]; then
            test "$WINDOWS_RESULT" = success
          else
            test "$WINDOWS_RESULT" = skipped
          fi
