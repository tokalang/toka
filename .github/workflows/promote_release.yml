name: Promote Verified Draft Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing v0.10.x draft tag to publish
        required: true
        type: string
      candidate_sha:
        description: Exact commit peeled from the annotated release tag
        required: true
        type: string
      qualification_run_id:
        description: Successful four-target Release Qualification run id
        required: true
        type: string
      replay_run_id:
        description: Successful qualified macOS x64 artifact replay run id
        required: true
        type: string

jobs:
  promote:
    name: Verify draft assets and publish
    runs-on: ubuntu-22.04
    environment: release-publication
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate promotion inputs
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v0\.10\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag_name must be a canonical v0.10.x tag" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [[ ! "$QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
             [[ ! "$REPLAY_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "candidate SHA or run id is invalid" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Bind annotated tag to candidate
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git rev-parse "refs/tags/$TAG_NAME^{tag}" >/dev/null
          test "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Verify draft state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --json tagName,isDraft,isPrerelease,assets \
            > draft-release.json
          python3 -c 'import json; d=json.load(open("draft-release.json")); assert d["isDraft"] is True and d["isPrerelease"] is False'

      - name: Verify exact draft asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          expected_assets=$(printf '%s\n' \
            SHA256SUMS \
            "toka-$TAG_NAME-linux-arm64.tar.gz" \
            "toka-$TAG_NAME-linux-x64.tar.gz" \
            "toka-$TAG_NAME-macos-arm64.tar.gz" \
            "toka-$TAG_NAME-macos-x64.tar.gz")
          actual_assets=$(gh release view "$TAG_NAME" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "draft asset names do not match the required release set" >&2
            exit 1
          fi

      - name: Download and verify published draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG_NAME" --dir release-assets \
            --pattern 'toka-*.tar.gz' --pattern SHA256SUMS
          python3 tools/scripts/verify_release_assets.py \
            --assets-dir release-assets \
            --version-label "$TAG_NAME" \
            --checksums-output release-assets/SHA256SUMS \
            --require-checksums

      - name: Read qualified runs
        id: qualified_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" \
            > qualification-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPLAY_RUN_ID" \
            > replay-run.json
          qualification_event=$(python3 -c \
            'import json; print(json.load(open("qualification-run.json"))["event"])')
          case "$qualification_event" in
            push) echo "archive_source=qualified_run" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "archive_source=candidate_run" >> "$GITHUB_OUTPUT" ;;
            *) echo "unsupported qualification run event" >&2; exit 1 ;;
          esac

      - name: Download four-target qualification evidence
        uses: actions/download-artifact@v4
        with:
          pattern: release-gate-*
          path: qualification-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Download qualified tag archives
        if: steps.qualified_source.outputs.archive_source == 'qualified_run'
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: qualification-archives
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Download qualified candidate archives
        if: steps.qualified_source.outputs.archive_source == 'candidate_run'
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-archive-*
          path: qualification-archives
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Download qualified artifact replay receipt
        uses: actions/download-artifact@v4
        with:
          name: qualified-artifact-replay-${{ inputs.tag_name }}-macos-x64
          path: replay-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.replay_run_id }}

      - name: Verify candidate, qualification, replay and draft assets
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
        run: |
          set -euo pipefail
          python3 tools/scripts/verify_release_qualification.py \
            --evidence-dir qualification-evidence \
            --revision "$CANDIDATE_SHA" \
            --version-label "$TAG_NAME" \
            --output qualification-summary.json
          python3 tools/scripts/verify_release_promotion.py \
            --tag-name "$TAG_NAME" \
            --candidate-sha "$CANDIDATE_SHA" \
            --qualification-run-id "$QUALIFICATION_RUN_ID" \
            --replay-run-id "$REPLAY_RUN_ID" \
            --draft-json draft-release.json \
            --qualification-run-json qualification-run.json \
            --replay-run-json replay-run.json \
            --qualification-summary qualification-summary.json \
            --replay-receipt replay-evidence/qualified-artifact-replay-receipt.json \
            --assets-dir release-assets \
            --qualified-archives-dir qualification-archives \
            --output promotion-verification.json

      - name: Upload bound promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-promotion-verification-${{ inputs.tag_name }}
          path: promotion-verification.json
          if-no-files-found: error

      - name: Publish reviewed full release as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
        run: |
          set -euo pipefail
          gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG_NAME"
          {
            echo "Published $TAG_NAME from candidate $CANDIDATE_SHA"
            echo "Qualification run: $QUALIFICATION_RUN_ID"
            echo "Qualified artifact replay run: $REPLAY_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
