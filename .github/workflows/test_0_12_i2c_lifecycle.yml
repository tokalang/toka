name: 0.12 I3-B scoped evidence candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: SDK host dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential curl wget lsb-release software-properties-common
          wget --timeout=15 --tries=3 -O "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo -E "$RUNNER_TEMP/llvm.sh" 20
          sudo apt-get install -y lld-20 liblld-20-dev libpolly-20-dev libzstd-dev libssl-dev pkg-config
          echo '/usr/lib/llvm-20/bin' >> "$GITHUB_PATH"
      - name: SDK host dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@20)/bin" >> "$GITHUB_PATH"
      - name: Download original immutable compiler SDK and build only candidate manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo tokalang/toka --pattern "toka-v0.11.0-${{ matrix.target }}.tar.gz" --dir "$RUNNER_TEMP/original"
          python3 tools/scripts/package_test_i2c_sdk.py --archive "$RUNNER_TEMP/original/toka-v0.11.0-${{ matrix.target }}.tar.gz" --target '${{ matrix.target }}' --work "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/package"
      - name: Source evidence/add controls and package regressions
        run: |
          mkdir -p "$RUNNER_TEMP/controls"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_toka_evidence.py -v > "$RUNNER_TEMP/controls/evidence.stdout" 2> "$RUNNER_TEMP/controls/evidence.stderr"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_toka_add.py > "$RUNNER_TEMP/controls/add.stdout" 2> "$RUNNER_TEMP/controls/add.stderr"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_toka_test_filesystem_linux.py > "$RUNNER_TEMP/controls/filesystem.stdout" 2> "$RUNNER_TEMP/controls/filesystem.stderr"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_package_manager_supply_chain.py > "$RUNNER_TEMP/controls/supply.stdout" 2> "$RUNNER_TEMP/controls/supply.stderr"
      - name: Freeze standalone acceptance bundle
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,shutil
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'harness';out.mkdir()
          names=['test_toka_add.py','test_toka_add_installed.py','test_toka_evidence_installed.py']
          for name in names:shutil.copyfile(Path('tools/scripts')/name,out/name)
          (out/'identity.json').write_text(json.dumps({'harness_source_sha':os.environ['GITHUB_SHA'],'files':{n:hashlib.sha256((out/n).read_bytes()).hexdigest() for n in names}},indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i3-evidence-sdk-${{ matrix.target }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/package
            ${{ runner.temp }}/harness
            ${{ runner.temp }}/controls
            ${{ runner.temp }}/stage/stage-identity.json
            ${{ runner.temp }}/stage/manager-build.stdout
            ${{ runner.temp }}/stage/manager-build.stderr
  installed:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: Manager runtime host dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - uses: actions/download-artifact@v4
        with:
          name: i3-evidence-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/input
      - name: Validate exact candidate and install without checkout
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);data=root/'input/package';identity=json.loads((data/'sdk-identity.json').read_text());assert identity['candidate_sha']==os.environ['GITHUB_SHA']
          archive=data/identity['archive'];assert hashlib.sha256(archive.read_bytes()).hexdigest()==identity['archive_sha256']
          install=root/'sdk';install.mkdir()
          with tarfile.open(archive) as t:t.extractall(install,filter='data')
          sdk=next(install.iterdir())
          for name,value in identity['components'].items():assert hashlib.sha256((sdk/name).read_bytes()).hexdigest()==value['sha256'] and (sdk/name).stat().st_mode&0o777==value['mode']
          h=json.loads((root/'input/harness/identity.json').read_text());assert h['harness_source_sha']==os.environ['GITHUB_SHA']
          for name,value in h['files'].items():assert hashlib.sha256((root/'input/harness'/name).read_bytes()).hexdigest()==value
          assert not (Path(os.environ['GITHUB_WORKSPACE'])/'.git').exists()
          (root/'sdk-path.txt').write_text(str(sdk))
          PYCODE
      - name: Exercise S01-S04 and accepted F01-F05 regressions with installed SDK
        run: |
          sdk=$(cat "$RUNNER_TEMP/sdk-path.txt")
          cd "$RUNNER_TEMP/input/harness"
          mkdir -p "$RUNNER_TEMP/installed"
          PYTHONDONTWRITEBYTECODE=1 python3 test_toka_evidence_installed.py --sdk "$sdk" --output "$RUNNER_TEMP/installed/evidence"
          PYTHONDONTWRITEBYTECODE=1 python3 test_toka_add_installed.py --sdk "$sdk" --output "$RUNNER_TEMP/installed/add"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i3-evidence-installed-${{ matrix.target }}
          include-hidden-files: true
          path: ${{ runner.temp }}/installed
