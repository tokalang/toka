name: 0.12 I3-B scoped evidence candidate
on:
  workflow_dispatch:
    inputs:
      e0_closure_only:
        description: E0 acquisition probes and Linux delivered-byte execution; reuse frozen SDK
        type: boolean
        default: false
      e0_only:
        description: Run fixed real-project E0 flows plus run-argument controls; no Q0
        type: boolean
        default: false
      platform_policy_only:
        description: Run PL controls and real basic SDK controls; no release qualification
        type: boolean
        default: false
      candidate_run:
        description: 'Reuse complete SDK/harness artifacts from this run; skip package jobs'
        type: string
        default: ''
      candidate_sha:
        description: 'Exact SDK/harness SHA required when reusing a candidate run'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: inputs.candidate_run == '' && !inputs.platform_policy_only && !inputs.e0_closure_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: SDK host dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential curl wget lsb-release software-properties-common
          wget --timeout=15 --tries=3 -O "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          chmod +x "$RUNNER_TEMP/llvm.sh"
          sudo -E "$RUNNER_TEMP/llvm.sh" 20
          sudo apt-get install -y lld-20 liblld-20-dev libpolly-20-dev libzstd-dev libssl-dev pkg-config
          echo '/usr/lib/llvm-20/bin' >> "$GITHUB_PATH"
      - name: SDK host dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@20)/bin" >> "$GITHUB_PATH"
      - name: Download original immutable compiler SDK and build only candidate manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo tokalang/toka --pattern "toka-v0.11.0-${{ matrix.target }}.tar.gz" --dir "$RUNNER_TEMP/original"
          python3 tools/scripts/package_test_i2c_sdk.py --archive "$RUNNER_TEMP/original/toka-v0.11.0-${{ matrix.target }}.tar.gz" --target '${{ matrix.target }}' --work "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/package"
      - name: Source evidence/add controls and package regressions
        run: |
          mkdir -p "$RUNNER_TEMP/controls"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_toka_evidence.py -v > "$RUNNER_TEMP/controls/evidence.stdout" 2> "$RUNNER_TEMP/controls/evidence.stderr"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_toka_add.py > "$RUNNER_TEMP/controls/add.stdout" 2> "$RUNNER_TEMP/controls/add.stderr"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_toka_test_filesystem_linux.py > "$RUNNER_TEMP/controls/filesystem.stdout" 2> "$RUNNER_TEMP/controls/filesystem.stderr"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/test_package_manager_supply_chain.py > "$RUNNER_TEMP/controls/supply.stdout" 2> "$RUNNER_TEMP/controls/supply.stderr"
      - name: Freeze standalone acceptance bundle
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,shutil
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'harness';out.mkdir()
          names=['test_toka_add.py','test_toka_add_installed.py','test_toka_evidence_installed.py','run_e0_tasks.py','test_run_arguments_installed.py']
          for name in names:shutil.copyfile(Path('tools/scripts')/name,out/name)
          (out/'identity.json').write_text(json.dumps({'harness_source_sha':os.environ['GITHUB_SHA'],'files':{n:hashlib.sha256((out/n).read_bytes()).hexdigest() for n in names}},indent=2)+'\n')
          PYCODE
      - name: Bundle immutable E0 task inputs
        if: inputs.e0_only
        run: |
          mkdir -p "$RUNNER_TEMP/e0-input/fixtures"
          git fetch --no-tags origin c4c1030cd33504a9f5d8dc670ab4ab0c1fc515e7
          git show c4c1030cd33504a9f5d8dc670ab4ab0c1fc515e7:spec/e0_input_plan.v1.json > "$RUNNER_TEMP/e0-input/e0_input_plan.v1.json"
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'e0-input';plan=json.loads((root/'e0_input_plan.v1.json').read_text())
          for name,digest in plan['task_fixtures'].items():
              path=root/'fixtures'/name;path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(subprocess.check_output(['git','show','c4c1030cd33504a9f5d8dc670ab4ab0c1fc515e7:tests/fixtures/e0/'+name]));assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PYCODE
      - uses: actions/upload-artifact@v4
        if: inputs.e0_only
        with:
          name: e0-input-${{ matrix.target }}
          path: ${{ runner.temp }}/e0-input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i3-evidence-sdk-${{ matrix.target }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/package
            ${{ runner.temp }}/harness
            ${{ runner.temp }}/controls
            ${{ runner.temp }}/stage/stage-identity.json
            ${{ runner.temp }}/stage/manager-build.stdout
            ${{ runner.temp }}/stage/manager-build.stderr
  installed:
    needs: package
    if: always() && !inputs.platform_policy_only && !inputs.e0_only && !inputs.e0_closure_only && (needs.package.result == 'success' || (inputs.candidate_run != '' && needs.package.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: Compiler and manager runtime host dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@20 lld@20 zstd openssl@3
      - uses: actions/download-artifact@v4
        with:
          name: i3-evidence-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/input
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Validate exact candidate and install without checkout
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,re,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);data=root/'input/package';identity=json.loads((data/'sdk-identity.json').read_text())
          candidate_run=os.environ['CANDIDATE_RUN'];expected=os.environ['CANDIDATE_SHA'] if candidate_run else os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}',expected) and identity['candidate_sha']==expected
          parent=None
          if candidate_run:
              assert candidate_run.isdigit()
              parent=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{candidate_run}']))
              assert parent['head_sha']==expected and parent['run_attempt']==1 and parent['status']=='completed'
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{candidate_run}/jobs']))['jobs']
              packages=[job for job in jobs if job['name'].startswith('package (')]
              assert len(packages)==3 and all(job['conclusion']=='success' for job in packages)
          archive=data/identity['archive'];assert hashlib.sha256(archive.read_bytes()).hexdigest()==identity['archive_sha256']
          install=root/'sdk';install.mkdir()
          with tarfile.open(archive) as t:t.extractall(install,filter='data')
          sdk=next(install.iterdir())
          for name,value in identity['components'].items():assert hashlib.sha256((sdk/name).read_bytes()).hexdigest()==value['sha256'] and (sdk/name).stat().st_mode&0o777==value['mode']
          h=json.loads((root/'input/harness/identity.json').read_text());assert h['harness_source_sha']==expected
          for name,value in h['files'].items():assert hashlib.sha256((root/'input/harness'/name).read_bytes()).hexdigest()==value
          assert not (Path(os.environ['GITHUB_WORKSPACE'])/'.git').exists()
          (root/'sdk-path.txt').write_text(str(sdk))
          (root/'installed').mkdir(exist_ok=True)
          (root/'installed/wiring.json').write_text(json.dumps({'SDK_sha':expected,'harness_sha':h['harness_source_sha'],'workflow_sha':os.environ['GITHUB_SHA'],'candidate_run':candidate_run or os.environ['GITHUB_RUN_ID'],'candidate_attempt':1,'archive_sha256':identity['archive_sha256'],'parent_run':parent,'without_checkout':True},indent=2)+'\n')
          PYCODE
      - name: Exercise S01-S04 and accepted F01-F05 regressions with installed SDK
        run: |
          sdk=$(cat "$RUNNER_TEMP/sdk-path.txt")
          cd "$RUNNER_TEMP/input/harness"
          mkdir -p "$RUNNER_TEMP/installed"
          PYTHONDONTWRITEBYTECODE=1 python3 test_toka_evidence_installed.py --sdk "$sdk" --output "$RUNNER_TEMP/installed/evidence"
          PYTHONDONTWRITEBYTECODE=1 python3 test_toka_add_installed.py --sdk "$sdk" --output "$RUNNER_TEMP/installed/add"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i3-evidence-installed-${{ matrix.target }}
          include-hidden-files: true
          path: ${{ runner.temp }}/installed

  platform-policy:
    if: inputs.platform_policy_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: LLVM host dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install llvm@20 lld@20 zstd openssl@3
      - name: SDK host dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential libssl-dev libzstd-dev
      - name: PL positive and negative controls, including unchanged legacy rules
        run: |
          mkdir -p "$RUNNER_TEMP/pl-controls"
          for script in test_release_platform_policy.py test_platform_installer.py test_release_workflow.py test_release_promotion.py test_qualified_draft.py test_installer_checksum.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 "tools/scripts/$script" > "$RUNNER_TEMP/pl-controls/$script.stdout" 2> "$RUNNER_TEMP/pl-controls/$script.stderr"
          done
      - name: Build a private Preview SDK solely for basic-execution controls
        if: inputs.candidate_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo tokalang/toka --pattern "toka-v0.11.0-${{ matrix.target }}.tar.gz" --dir "$RUNNER_TEMP/original"
          PYTHONDONTWRITEBYTECODE=1 python3 tools/scripts/package_test_i2c_sdk.py --archive "$RUNNER_TEMP/original/toka-v0.11.0-${{ matrix.target }}.tar.gz" --target '${{ matrix.target }}' --work "$RUNNER_TEMP/stage" --output "$RUNNER_TEMP/package"
          mkdir "$RUNNER_TEMP/basic-harness"
          cp tools/scripts/validate_sdk_basic.py tools/scripts/release_platform_policy.py "$RUNNER_TEMP/basic-harness/"
      - name: Download frozen PL SDK without rebuilding
        if: inputs.candidate_run != ''
        uses: actions/download-artifact@v4
        with:
          name: platform-policy-${{ matrix.target }}
          path: ${{ runner.temp }}/frozen-input
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Bind original SDK and new validation script identities
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_RUN_ID: ${{ inputs.candidate_run || github.run_id }}
          SDK_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,re,shutil,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);revision=os.environ['SDK_SHA'];assert re.fullmatch('[0-9a-f]{40}',revision)
          source_attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if (root/'frozen-input').exists():
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["SDK_RUN_ID"]}']))
              assert run['head_sha']==revision and run['run_attempt']==1 and run['conclusion']=='success'
              source_attempt=run['run_attempt']
              shutil.copytree(root/'frozen-input/package',root/'package')
          data=json.loads((root/'package/sdk-identity.json').read_text());assert data['candidate_sha']==revision
          archive=root/'package'/data['archive'];assert hashlib.sha256(archive.read_bytes()).hexdigest()==data['archive_sha256']
          with tarfile.open(archive) as t:
              prefix='toka-v0.11.0-'+data['target']+'/'
              for name,fact in data['components'].items():assert hashlib.sha256(t.extractfile(prefix+name).read()).hexdigest()==fact['sha256'] and t.getmember(prefix+name).mode==fact['mode']
          harness=root/'basic-harness';harness.mkdir(exist_ok=True)
          for name in ('validate_sdk_basic.py','release_platform_policy.py'):shutil.copyfile(Path('tools/scripts')/name,harness/name)
          (root/'validation-wiring.json').write_text(json.dumps({'SDK_sha':revision,'SDK_source_run_id':int(os.environ['SDK_RUN_ID']),'SDK_source_run_attempt':source_attempt,'archive_sha256':data['archive_sha256'],'validator_sha':os.environ['GITHUB_SHA'],'validation_run_id':int(os.environ['GITHUB_RUN_ID']),'validation_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'harness':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in harness.iterdir()}},indent=2)+'\n')
          PYCODE
      - name: Run actual SDK install/create/build/run/test controls with source unavailable
        env:
          TARGET: ${{ matrix.target }}
          SDK_SHA: ${{ inputs.candidate_sha || github.sha }}
          SDK_RUN_ID: ${{ inputs.candidate_run || github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          sdk_attempt=$(python3 -c 'import json; print(json.load(open("validation-wiring.json"))["SDK_source_run_attempt"])')
          python3 basic-harness/validate_sdk_basic.py \
            --archive "package/toka-preview-i2c-$TARGET.tar.gz" --target "$TARGET" \
            --revision "$SDK_SHA" --version-label v0.11.0 \
            --source-run-id "$SDK_RUN_ID" --source-run-attempt "$sdk_attempt" \
            --control-preview --output-dir "$RUNNER_TEMP/basic-control"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-policy-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pl-controls
            ${{ runner.temp }}/package
            ${{ runner.temp }}/basic-control
            ${{ runner.temp }}/validation-wiring.json
            ${{ runner.temp }}/basic-harness
            ${{ runner.temp }}/stage/stage-identity.json
            ${{ runner.temp }}/stage/manager-build.stderr
            ${{ runner.temp }}/stage/manager-build.stdout

  e0:
    if: always() && inputs.e0_only && (needs.package.result == 'success' || (inputs.candidate_run != '' && needs.package.result == 'skipped'))
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: Installed SDK host dependencies
        if: runner.os == 'macOS'
        run: brew install llvm@20 lld@20 zstd openssl@3
      - uses: actions/download-artifact@v4
        with:
          name: i3-evidence-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Fetch immutable E0 inputs without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'e0-input';root.mkdir()
          revision='c4c1030cd33504a9f5d8dc670ab4ab0c1fc515e7'
          def read(path):return subprocess.check_output(['gh','api','repos/tokalang/toka/contents/'+path+'?ref='+revision,'-H','Accept: application/vnd.github.raw+json'])
          raw=read('spec/e0_input_plan.v1.json');(root/'e0_input_plan.v1.json').write_bytes(raw)
          for name,digest in json.loads(raw)['task_fixtures'].items():
              path=root/'fixtures'/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(read('tests/fixtures/e0/'+name));assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PYCODE
      - name: Bind SDK/input identities and obtain original published comparison
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          SDK_SOURCE_SHA: ${{ inputs.candidate_sha || github.sha }}
          SDK_SOURCE_RUN: ${{ inputs.candidate_run || github.run_id }}
        run: |
          gh api "repos/tokalang/toka/actions/runs/$SDK_SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh release download v0.11.0 --repo tokalang/toka --pattern "toka-v0.11.0-$TARGET.tar.gz" --dir "$RUNNER_TEMP/original"
          python3 - <<'PYCODE'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);identity=json.loads((root/'candidate/package/sdk-identity.json').read_text());assert identity['candidate_sha']==os.environ['SDK_SOURCE_SHA']
          source_run=json.loads((root/'source-run.json').read_text());assert source_run['head_sha']==identity['candidate_sha'] and source_run['run_attempt']==1
          if str(source_run['id'])!=os.environ['GITHUB_RUN_ID']:
              import subprocess
              jobs=json.loads(subprocess.check_output(['gh','api','repos/tokalang/toka/actions/runs/'+str(source_run['id'])+'/jobs']))['jobs']
              producer=next(j for j in jobs if j['name'].startswith('package ('+os.environ['TARGET']+','))
              for name in ('Download original immutable compiler SDK and build only candidate manager','Source evidence/add controls and package regressions','Freeze standalone acceptance bundle','Run actions/upload-artifact@v4'):
                  assert any(step['name']==name and step['conclusion']=='success' for step in producer['steps']),name
              assert source_run['status']=='completed'
              # A task-input bundling failure does not invalidate the already frozen SDK bytes.
              assert all(step['conclusion']!='failure' or step['name']=='Bundle immutable E0 task inputs' for step in producer['steps'])
          archive=root/'candidate/package'/identity['archive'];assert hashlib.sha256(archive.read_bytes()).hexdigest()==identity['archive_sha256']
          h=json.loads((root/'candidate/harness/identity.json').read_text());assert h['harness_source_sha']==identity['candidate_sha']
          for name,digest in h['files'].items():assert hashlib.sha256((root/'candidate/harness'/name).read_bytes()).hexdigest()==digest
          import subprocess
          script=root/'candidate/harness/run_e0_tasks.py'
          original_script_digest=hashlib.sha256(script.read_bytes()).hexdigest()
          script.write_bytes(subprocess.check_output(['gh','api','repos/tokalang/toka/contents/tools/scripts/run_e0_tasks.py?ref='+os.environ['GITHUB_SHA'],'-H','Accept: application/vnd.github.raw+json']))
          script_digest=hashlib.sha256(script.read_bytes()).hexdigest()
          base={'linux-x64':'05faa6cf2128f9dc385aa832c33f722e34f5a4f4b98d0613887a3efe79a35635','linux-arm64':'16e8deda50d7983bfa9cffc9f55e8587f4b9b3f4c72c7346a3e82f3c173466f1','macos-arm64':'81e95d01f685f4fbb057fc42b03c376c2646b41bce08398f8f40a76d2cdd7b99'}
          target=os.environ['TARGET'];assert hashlib.sha256((root/'original'/('toka-v0.11.0-'+target+'.tar.gz')).read_bytes()).hexdigest()==base[target]
          assert not (Path(os.environ['GITHUB_WORKSPACE'])/'.git').exists() and not (Path(os.environ['GITHUB_WORKSPACE'])/'src').exists()
          (root/'e0-binding.json').write_text(json.dumps({'SDK_sha':identity['candidate_sha'],'script_sha':os.environ['GITHUB_SHA'],'script_sha256':script_digest,'original_bundled_script_sha256':original_script_digest,'SDK_source_run':source_run['id'],'SDK_source_attempt':source_run['run_attempt'],'SDK_source_run_conclusion':source_run['conclusion'],'validation_run':int(os.environ['GITHUB_RUN_ID']),'validation_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'candidate_archive_sha256':identity['archive_sha256'],'original_archive_sha256':base[target],'input_sha':'c4c1030cd33504a9f5d8dc670ab4ab0c1fc515e7','actual_execution_actor':'Codex scripted workflows','human_participant':False,'source_checkout_absent':True},indent=2)+'\n')
          PYCODE
      - name: Runtime argument regression and both fixed task flows
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir e0-results
          cp e0-binding.json e0-results/
          candidate="candidate/package/toka-preview-i2c-$TARGET.tar.gz"
          python3 - <<'PYCODE'
          import os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);(root/'argv-sdk').mkdir()
          with tarfile.open(root/'candidate/package'/('toka-preview-i2c-'+os.environ['TARGET']+'.tar.gz')) as t:t.extractall(root/'argv-sdk',filter='data')
          PYCODE
          python3 candidate/harness/test_run_arguments_installed.py --sdk "argv-sdk/toka-v0.11.0-$TARGET" --output e0-results/run-arguments
          for variant in candidate original_0.11.0; do
            if [[ "$variant" == candidate ]]; then
              archive="$candidate"
              revision=$(python3 -c 'import json; print(json.load(open("e0-binding.json"))["SDK_sha"])')
              digest=$(python3 -c 'import json; print(json.load(open("e0-binding.json"))["candidate_archive_sha256"])')
            else
              archive="original/toka-v0.11.0-$TARGET.tar.gz"
              revision=57b0f7dd7d52bdc24c6dde0457803240e5c62e8a
              digest=$(python3 -c 'import json; print(json.load(open("e0-binding.json"))["original_archive_sha256"])')
            fi
            for flow in AI_process documentation_replay; do
              python3 candidate/harness/run_e0_tasks.py --input-plan e0-input/e0_input_plan.v1.json --fixtures e0-input/fixtures \
                --sdk-archive "$archive" --sdk-sha256 "$digest" --sdk-source-sha "$revision" --variant "$variant" \
                --flow "$flow" --output "e0-results/$variant-$flow"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e0-results-${{ matrix.target }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/e0-results
            !${{ runner.temp }}/e0-results/**/installed-sdk/**

  e0-closure:
    if: inputs.e0_closure_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - uses: actions/download-artifact@v4
        with:
          name: i3-evidence-sdk-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate
          run-id: 37191546927
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: e0-results-${{ matrix.target }}
          path: ${{ runner.temp }}/old-e0
          run-id: 37191719627
          github-token: ${{ github.token }}
      - name: Bind frozen inputs and fetch closure scripts without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);out=root/'e0-closure';out.mkdir();code=out/'scripts';code.mkdir();fixtures=out/'fixtures';fixtures.mkdir()
          def read(path,revision):return subprocess.check_output(['gh','api','repos/tokalang/toka/contents/'+path+'?ref='+revision,'-H','Accept: application/vnd.github.raw+json'])
          revision='c4c1030cd33504a9f5d8dc670ab4ab0c1fc515e7';raw=read('spec/e0_input_plan.v1.json',revision);(out/'input-plan.json').write_bytes(raw);plan=json.loads(raw)
          data=read('tests/fixtures/e0/verify_csv.py',revision);assert hashlib.sha256(data).hexdigest()==plan['task_fixtures']['verify_csv.py'];(fixtures/'verify_csv.py').write_bytes(data)
          names=['measure_e0_acquisition.py','run_e0_delivery_installed.py']
          for name in names:(code/name).write_bytes(read('tools/scripts/'+name,os.environ['GITHUB_SHA']))
          (out/'user-guide.md').write_bytes(read('docs/0_12_e0_user_guide.md',os.environ['GITHUB_SHA']))
          source=json.loads(subprocess.check_output(['gh','api','repos/tokalang/toka/actions/runs/37191546927']));assert source['run_attempt']==1 and source['head_sha']=='59b40e6dd659593871c644fc2f00a696606ab850'
          identity=json.loads((root/'candidate/package/sdk-identity.json').read_text());assert identity['candidate_sha']==source['head_sha']
          digest={'linux-x64':'80c15e5b38d79e51889d9efd5e40e2cd00d15757d79618af808a10d6086fef71','linux-arm64':'f58bc516ad72754d4bee22c94ecfec8dfd979f2443e037b6134a556cb1a93449','macos-arm64':'b1d9173007cdb0ae39b6c8b7b061807d2eef90622470ee7bf08f21b049366ab0'}[os.environ['TARGET']]
          archive=root/'candidate/package'/identity['archive'];assert hashlib.sha256(archive.read_bytes()).hexdigest()==identity['archive_sha256']==digest
          install=root/'sdk';install.mkdir()
          with tarfile.open(archive) as t:t.extractall(install,filter='data')
          sdk=next(install.iterdir());descriptor=json.loads((sdk/'preview-sdk.json').read_text());assert descriptor['components']==identity['components']
          for name,facts in descriptor['components'].items():assert hashlib.sha256((sdk/name).read_bytes()).hexdigest()==facts['sha256'] and (sdk/name).stat().st_mode&0o777==facts['mode']
          assert not (Path(os.environ['GITHUB_WORKSPACE'])/'.git').exists() and not (Path(os.environ['GITHUB_WORKSPACE'])/'src').exists()
          (out/'binding.json').write_text(json.dumps({'SDK_sha':identity['candidate_sha'],'SDK_archive_sha256':digest,'SDK_source_run':source['id'],'SDK_source_attempt':source['run_attempt'],'SDK_source_conclusion':source['conclusion'],'script_sha':os.environ['GITHUB_SHA'],'script_digests':{n:hashlib.sha256((code/n).read_bytes()).hexdigest() for n in names},'guide_digest':hashlib.sha256((out/'user-guide.md').read_bytes()).hexdigest(),'input_sha':revision,'validation_run':int(os.environ['GITHUB_RUN_ID']),'validation_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_checkout_absent':True},indent=2)+'\n')
          PYCODE
      - name: Acquire fixed dependency with explicit timing boundary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$RUNNER_TEMP"
          python3 e0-closure/scripts/measure_e0_acquisition.py --sdk "sdk/toka-v0.11.0-$TARGET" --input-plan e0-closure/input-plan.json --output e0-closure/acquisition
      - name: Run relocated original application delivery bytes on Linux
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP"
          python3 e0-closure/scripts/run_e0_delivery_installed.py --receipts old-e0 --fixtures e0-closure/fixtures --output e0-closure/deliveries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e0-closure-${{ matrix.target }}
          include-hidden-files: true
          path: ${{ runner.temp }}/e0-closure
