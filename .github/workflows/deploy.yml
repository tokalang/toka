name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Setup Emscripten ⚙️
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'

      - name: Compile Toka Playground (Wasm) 🛠️
        run: |
          tools/scripts/build_browser_compiler.sh build_wasm
          cp build_wasm/tokacheck.js playground/
          cp build_wasm/tokacheck.wasm playground/
          
          # Run self-test to ensure compiler behavior is correct and all playground samples pass
          cd playground
          node self_test.js
          cd ..
          
          # Move playground to Astro public directory so it gets served under /playground
          mkdir -p website/public/playground
          cp playground/app.js website/public/playground/
          cp playground/index.html website/public/playground/
          cp playground/style.css website/public/playground/
          cp playground/toka_mode.js website/public/playground/
          cp playground/tokacheck.js website/public/playground/
          cp playground/tokacheck.wasm website/public/playground/

      - name: Install dependencies 📦
        working-directory: ./website
        run: npm ci

      - name: Build Astro 🚀
        working-directory: ./website
        run: |
          cp ../tools/install.sh public/install.sh
          npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          cname: tokalang.dev
          force_orphan: true
