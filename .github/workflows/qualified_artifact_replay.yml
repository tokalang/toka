name: Qualified macOS x64 Artifact Replay

on:
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Replay qualified 0.12 candidate bytes before creating a tag or draft
        type: boolean
        default: false
      tag_name:
        description: Canonical version label; tag required unless candidate_only for 0.12
        required: true
        type: string
      optional_run_id:
        description: Optional Intel validation run included in this asset set
        type: string
        default: ''
      candidate_sha:
        description: Exact qualified source SHA; must match tag when tag-bound
        required: true
        type: string
      qualification_run_id:
        description: Successful version-bound Release Qualification run id for the same candidate
        required: true
        type: string
      archive_sha256:
        description: SHA-256 recorded for the macOS x64 draft asset
        required: false
        type: string
      asset_source:
        description: Read the tagged or candidate archive from the qualified run
        required: true
        default: qualified_run
        type: choice
        options:
          - qualified_run
          - candidate_run

permissions:
  actions: read
  contents: read

jobs:
  replay:
    if: ${{ !startsWith(inputs.tag_name, 'v0.12.') }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Bind replay to candidate and qualification run
        env:
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ASSET_SOURCE: ${{ inputs.asset_source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_ONLY" = false || { echo "Candidate-only replay is restricted to 0.12" >&2; exit 2; }
          [[ "$TAG_NAME" =~ ^v0\.11\.(0|[1-9][0-9]*)$ ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          [[ "$QUALIFICATION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          [[ "$ASSET_SOURCE" = qualified_run || "$ASSET_SOURCE" = candidate_run ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          git rev-parse "refs/tags/$TAG_NAME^{tag}" >/dev/null || { echo "Replay requires annotated tag" >&2; exit 2; }
          test "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")" = \
            "$CANDIDATE_SHA" || { echo "Replay tag SHA mismatch" >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo "Replay checkout SHA mismatch" >&2; exit 2; }
          run_api="repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID"
          test "$(gh api "$run_api" --jq .status)" = completed
          test "$(gh api "$run_api" --jq .conclusion)" = success
          test "$(gh api "$run_api" --jq .head_sha)" = "$CANDIDATE_SHA"

      - name: Install SDK host dependencies
        run: brew install lld@20 zstd openssl@3

      - name: Download qualified macOS x64 archive
        if: inputs.asset_source == 'qualified_run'
        uses: actions/download-artifact@v4
        with:
          name: release-archive-macos-x64
          path: qualified-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Download byte-identical candidate archive
        if: inputs.asset_source == 'candidate_run'
        uses: actions/download-artifact@v4
        with:
          name: candidate-archive-macos-x64
          path: qualified-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Verify and replay qualified archive from a clean extraction
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          ASSET_SOURCE: ${{ inputs.asset_source }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/qualified-assets/toka-$TAG_NAME-macos-x64.tar.gz"
          test -f "$archive"
          actual_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          test "$actual_sha256" = "$ARCHIVE_SHA256"

          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          tar -xzf "$archive" -C "$work_dir"
          sdk="$work_dir/toka-$TAG_NAME-macos-x64"
          export PATH="$sdk/bin:$PATH"
          export TOKA_LIB="$sdk/lib"

          toka doctor
          cd "$work_dir"
          toka new smoke
          cd smoke
          toka run

          mkdir ../local_dep
          printf '%s\n' \
            'pub const PACKAGE = (name = "dependency", version = "1.0.0", dependencies = ())' \
            > ../local_dep/package.tk
          mkdir -p ../local_dep/lib/dependency
          printf '%s\n' 'pub fn value() -> i32 { return 1 }' \
            > ../local_dep/lib/dependency/mod.tk
          toka add ../local_dep
          toka fetch
          cp package.lock ../local-online.lock
          rm -rf target .toka
          rm -f .toka_build_exe
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock ../local-online.lock
          toka run

          cd ..
          printf '%s\n' 'pub fn value() -> i32 { return 1 }' > base.tk
          printf '%s\n' \
            'pub fn value(value#: i32) -> i32 {' \
            '    value = value + 1' \
            '    return value' \
            '}' > candidate.tk
          (
            cd "$sdk/bin"
            ./toka preview --base "$work_dir/base.tk" \
              --candidate "$work_dir/candidate.tk"
          ) > preview.json
          python3 -c 'import json; d=json.load(open("preview.json")); assert d["schema"] == "toka.semantic-diff-preview" and d["version"] == 1'

          mkdir registry
          cd registry
          toka new registry_smoke
          cd registry_smoke
          toka add unicode
          toka fetch
          cp package.lock ../registry-online.lock
          rm -rf target .toka/packages .toka/build
          rm -f .toka_build_exe
          test "$(find .toka -type f | wc -l | tr -d ' ')" = 1
          TOKA_OFFLINE=1 toka fetch
          cmp package.lock ../registry-online.lock

          receipt="$GITHUB_WORKSPACE/qualified-artifact-replay-receipt.json"
          python3 -c \
            'import json,os; print(json.dumps({"archive_sha256":os.environ["ARCHIVE_SHA256"],"asset_source":os.environ["ASSET_SOURCE"],"candidate_revision":os.environ["CANDIDATE_SHA"],"qualification_run_id":int(os.environ["QUALIFICATION_RUN_ID"]),"result":"pass","schema":"toka.qualified-artifact-replay","target":"macos-x64","version":1,"version_label":os.environ["TAG_NAME"]},sort_keys=True,separators=(",",":")))' \
            > "$receipt"

      - name: Upload replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: qualified-artifact-replay-${{ inputs.tag_name }}-macos-x64
          path: qualified-artifact-replay-receipt.json
          if-no-files-found: error

  policy-plan:
    if: startsWith(inputs.tag_name, 'v0.12.')
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_only && inputs.candidate_sha || inputs.tag_name }}
          fetch-depth: 0
          sparse-checkout: tools/scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          OPTIONAL_RUN_ID: ${{ inputs.optional_run_id }}
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          ASSET_SOURCE: ${{ inputs.asset_source }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v0\.12\.(0|[1-9][0-9]*)$ ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Replay input guard rejected: TAG_NAME=$TAG_NAME CANDIDATE_SHA=$CANDIDATE_SHA" >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || { echo "Replay checkout SHA mismatch" >&2; exit 2; }
          if [[ "$CANDIDATE_ONLY" == true ]]; then
            test "$ASSET_SOURCE" = candidate_run || { echo "Candidate replay requires candidate_run" >&2; exit 2; }
          else
            git rev-parse "refs/tags/$TAG_NAME^{tag}" >/dev/null || { echo "Replay requires annotated tag" >&2; exit 2; }
            test "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")" = "$CANDIDATE_SHA" || { echo "Replay tag SHA mismatch" >&2; exit 2; }
          fi
          extra=()
          if [[ -n "$OPTIONAL_RUN_ID" ]]; then extra+=(--optional-run-id "$OPTIONAL_RUN_ID"); fi
          python3 tools/scripts/fetch_policy_candidate.py --repository "$GITHUB_REPOSITORY" \
            --revision "$CANDIDATE_SHA" --tag-name "$TAG_NAME" --qualification-run-id "$QUALIFICATION_RUN_ID" \
            "${extra[@]}" --output-dir policy-candidate
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'tools/scripts')
          import release_platform_policy as policy
          root=Path('policy-candidate');summary=json.loads((root/'qualification-summary.json').read_text());run=json.loads((root/'qualification-run.json').read_text())
          if os.environ['CANDIDATE_ONLY']=='true':assert run['event']=='workflow_dispatch'
          rows=json.loads((root/'qualification-artifacts.json').read_text())['artifacts']
          prefix='candidate-archive-' if run['event']=='workflow_dispatch' else 'release-archive-'
          runners={'linux-x64':'ubuntu-22.04','linux-arm64':'ubuntu-24.04-arm','macos-arm64':'macos-15','macos-x64':'macos-15-intel'}
          include=[]
          for target in policy.included_targets(summary,os.environ['CANDIDATE_SHA'],os.environ['TAG_NAME']):
              row=next(r for r in rows if r['name']==prefix+target)
              include.append({'target':target,'runner':runners[target],'artifact_id':row['id'],'artifact_digest':row['digest']})
          print('matrix='+json.dumps({'include':include}))
          PYCODE
          mkdir replay-input
          cp policy-candidate/qualification-run.json policy-candidate/qualification-summary.json replay-input/
          cp tools/scripts/validate_sdk_basic.py tools/scripts/release_platform_policy.py replay-input/
          cp tools/scripts/test_toka_add.py tools/scripts/test_toka_add_installed.py \
            tools/scripts/test_toka_evidence_installed.py tools/scripts/test_run_arguments_installed.py replay-input/
      - uses: actions/upload-artifact@v4
        with:
          name: policy-replay-input
          path: replay-input
  policy-replay:
    needs: policy-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - name: SDK host dependencies
        if: runner.os == 'macOS'
        run: brew install llvm@20 lld@20 zstd openssl@3
      - uses: actions/download-artifact@v4
        with:
          name: policy-replay-input
          path: ${{ runner.temp }}/replay-input
      - name: Authenticate original package and run without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
          ARTIFACT_DIGEST: ${{ matrix.artifact_digest }}
          TARGET: ${{ matrix.target }}
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > package.zip
          python3 - <<'PYCODE'
          import hashlib,json,os,zipfile
          from pathlib import Path
          raw=Path('package.zip');assert 'sha256:'+hashlib.sha256(raw.read_bytes()).hexdigest()==os.environ['ARTIFACT_DIGEST']
          name='toka-%s-%s.tar.gz'%(os.environ['TAG_NAME'],os.environ['TARGET'])
          with zipfile.ZipFile(raw) as z:
              assert z.namelist()==[name];Path(name).write_bytes(z.read(name))
          assert not (Path(os.environ['GITHUB_WORKSPACE'])/'src').exists()
          PYCODE
          attempt=$(python3 -c 'import json; print(json.load(open("replay-input/qualification-run.json"))["run_attempt"])')
          python3 replay-input/validate_sdk_basic.py --archive "toka-$TAG_NAME-$TARGET.tar.gz" \
            --target "$TARGET" --revision "$CANDIDATE_SHA" --version-label "$TAG_NAME" \
            --source-run-id "$QUALIFICATION_RUN_ID" --source-run-attempt "$attempt" --output-dir replay-results
          python3 - <<'PYCODE'
          import os,tarfile
          from pathlib import Path
          archive=Path('toka-%s-%s.tar.gz'%(os.environ['TAG_NAME'],os.environ['TARGET']))
          Path('installed-sdk').mkdir()
          with tarfile.open(archive) as package:package.extractall('installed-sdk',filter='data')
          PYCODE
          sdk="$RUNNER_TEMP/installed-sdk/toka-$TAG_NAME-$TARGET"
          python3 replay-input/test_toka_add_installed.py --sdk "$sdk" --output replay-results/add
          python3 replay-input/test_toka_evidence_installed.py --sdk "$sdk" --output replay-results/evidence
          python3 replay-input/test_run_arguments_installed.py --sdk "$sdk" --output replay-results/argv
          python3 - <<'PYCODE'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'replay-input');import release_platform_policy as policy
          r=json.loads(Path('replay-results/basic-receipt.json').read_text());q=json.loads(Path('replay-input/qualification-run.json').read_text())
          row={'schema':'toka.qualified-artifact-replay','version':2,'policy_id':policy.POLICY,'target':os.environ['TARGET'],'candidate_revision':os.environ['CANDIDATE_SHA'],'version_label':os.environ['TAG_NAME'],'qualification_run_id':int(os.environ['QUALIFICATION_RUN_ID']),'qualification_run_attempt':q['run_attempt'],'asset_source':'candidate_run' if q['event']=='workflow_dispatch' else 'qualified_run','archive_sha256':r['archive_sha256'],'tag_bound':os.environ['CANDIDATE_ONLY']!='true','result':'pass'}
          Path('replay-results/replay-receipt.json').write_text(json.dumps(row,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-replay-${{ matrix.target }}
          path: ${{ runner.temp }}/replay-results
  policy-summary:
    needs: [policy-plan, policy-replay]
    if: always() && needs.policy-plan.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: policy-replay-*
          path: replay-evidence
      - name: Require exact included set and all successful replays
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          python3 - <<'PYCODE'
          import json,os,sys
          from pathlib import Path
          root=Path('replay-evidence');inputs=root/'policy-replay-input';sys.path.insert(0,str(inputs));import release_platform_policy as policy
          q=json.loads((inputs/'qualification-run.json').read_text());s=json.loads((inputs/'qualification-summary.json').read_text())
          rows=[json.loads(p.read_text()) for p in root.glob('policy-replay-*/replay-receipt.json')]
          targets=policy.included_targets(s,os.environ['CANDIDATE_SHA'],os.environ['TAG_NAME'])
          errors=[]
          if len(rows)!=len(targets) or {r['target'] for r in rows}!=set(targets) or any(r.get('result')!='pass' for r in rows):errors.append('missing/failed package replay')
          result={'schema':'toka.qualified-artifact-replay-summary','version':2,'policy_id':policy.POLICY,'candidate_revision':os.environ['CANDIDATE_SHA'],'version_label':os.environ['TAG_NAME'],'qualification_run_id':int(os.environ['QUALIFICATION_RUN_ID']),'qualification_run_attempt':q['run_attempt'],'replay_run_id':int(os.environ['GITHUB_RUN_ID']),'replay_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'receipts':rows,'errors':errors,'result':'fail' if errors else 'pass'}
          Path('qualified-artifact-replay-receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          raise SystemExit(bool(errors))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-artifact-replay-${{ inputs.tag_name }}-summary
          path: qualified-artifact-replay-receipt.json
