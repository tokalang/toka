name: Native Build Reference Qualification

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Fixed-seed mutation cycles
        required: true
        default: "100"
        type: string

jobs:
  qualify:
    name: Native build reference (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
          - name: macos-arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y cmake ninja-build liblld-20-dev lld-20 libpolly-20-dev libzstd-dev

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 zstd
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"

      - name: Build compiler
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${LLVM_DIR:+-DLLVM_DIR="$LLVM_DIR"} \
            ${LLD_DIR:+-DLLD_DIR="$LLD_DIR"} \
            ${ZSTD_LIBRARY:+-DZSTD_LIBRARY="$ZSTD_LIBRARY"}
          cmake --build build --parallel 2

      - name: Run source-less facade replay
        run: tools/scripts/test_native_build_reference.sh

      - name: Run sustained qualification
        run: |
          tools/scripts/qualify_native_build.py \
            --cycles "${{ inputs.cycles }}" \
            --report "build/native-build-reference-${{ matrix.name }}.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-reference-${{ matrix.name }}
          path: build/native-build-reference-${{ matrix.name }}.json
          if-no-files-found: error
