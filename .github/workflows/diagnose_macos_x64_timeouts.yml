name: Diagnose macOS x64 CTest timeouts

# Diagnostic only. This workflow cannot qualify or publish a release.
on:
  push:
    branches:
      - diagnose/macos-x64-timeouts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: 100b9fd62a6b9e12dcb1f5b8a4f2282dc088cb3f
          path: source
          fetch-depth: 0

      - name: Verify exact base and isolated diagnostic diff
        env:
          BASE_SHA: 100b9fd62a6b9e12dcb1f5b8a4f2282dc088cb3f
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C driver merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git -C driver rev-parse HEAD)" = "$GITHUB_SHA"
          changed=$(git -C driver diff --name-only "$BASE_SHA"..HEAD | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            .github/workflows/diagnose_macos_x64_timeouts.yml \
            tools/scripts/test_datafile_thread_lease.py \
            tools/scripts/test_native_sync_rw_unlock.py)
          test "$changed" = "$expected"
          test -z "$(git -C source status --porcelain --untracked-files=no)"
          mkdir -p diagnosis
          {
            echo "baseline_sha=$BASE_SHA"
            echo "baseline_tree=$(git -C source rev-parse HEAD^{tree})"
            echo "diagnostic_driver_sha=$GITHUB_SHA"
            echo "diagnostic_diff:"
            printf '%s\n' "$changed"
          } > diagnosis/identity.txt
          (
            cd source
            git ls-files -z tests/semantics/datafile_lease \
              tests/conformance/io/datafile_concurrency_test.tk \
              lib/std/data_file.tk lib/std/sync \
              | xargs -0 shasum -a 256
          ) > diagnosis/fixtures.sha256

      - name: Install compiler host dependencies
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build exact baseline compiler and runtime
        id: build
        run: |
          set -euo pipefail
          cmake -S source -B source/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTOKA_RELEASE_VERSION_OVERRIDE=0.10.0 \
            -DLLVM_DIR="$LLVM_DIR" -DLLD_DIR="$LLD_DIR" \
            -DZSTD_LIBRARY="$ZSTD_LIBRARY" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build source/build --target tokac --parallel 4
          (cd source && python3 tools/scripts/test_pass.py --prepare-runtime-only)
          test -z "$(git -C source status --porcelain --untracked-files=no)"
          {
            echo "compiler_version=$(source/build/bin/tokac --version)"
            echo "compiler_sha256=$(shasum -a 256 source/build/bin/tokac | awk '{print $1}')"
          } >> diagnosis/identity.txt

      - name: Overlay only the two diagnostic drivers
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          cp driver/tools/scripts/test_datafile_thread_lease.py source/tools/scripts/
          cp driver/tools/scripts/test_native_sync_rw_unlock.py source/tools/scripts/
          changed=$(git -C source diff --name-only | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            tools/scripts/test_datafile_thread_lease.py \
            tools/scripts/test_native_sync_rw_unlock.py)
          test "$changed" = "$expected"
          git -C source diff --check
          {
            echo "overlaid_driver_sha256:"
            shasum -a 256 source/tools/scripts/test_datafile_thread_lease.py \
              source/tools/scripts/test_native_sync_rw_unlock.py
          } >> diagnosis/identity.txt

      - name: Diagnose DataFile lease serially
        id: datafile
        if: steps.build.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -euo pipefail
          (cd source && python3 -u tools/scripts/test_datafile_thread_lease.py \
            --build-dir build) 2>&1 | tee diagnosis/datafile.log

      - name: Diagnose RwMutex unlock serially
        id: rw_unlock
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -euo pipefail
          (cd source && python3 -u tools/scripts/test_native_sync_rw_unlock.py \
            --build-dir build) 2>&1 | tee diagnosis/rw-unlock.log

      - name: Record diagnostic outcomes
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DATAFILE_OUTCOME: ${{ steps.datafile.outcome }}
          RW_UNLOCK_OUTCOME: ${{ steps.rw_unlock.outcome }}
        run: |
          mkdir -p diagnosis
          python3 -c \
            'import json,os; print(json.dumps({"schema":"toka.macos-x64-timeout-diagnostic","version":1,"baseline_sha":"100b9fd62a6b9e12dcb1f5b8a4f2282dc088cb3f","driver_sha":os.environ["GITHUB_SHA"],"build":os.environ["BUILD_OUTCOME"],"datafile":os.environ["DATAFILE_OUTCOME"],"rw_unlock":os.environ["RW_UNLOCK_OUTCOME"],"qualification":False},sort_keys=True))' \
            > diagnosis/outcome.json

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-timeout-diagnostic
          path: diagnosis/
          if-no-files-found: error

      - name: Conclude diagnostics
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DATAFILE_OUTCOME: ${{ steps.datafile.outcome }}
          RW_UNLOCK_OUTCOME: ${{ steps.rw_unlock.outcome }}
        run: |
          set -euo pipefail
          test "$BUILD_OUTCOME" = success
          test "$DATAFILE_OUTCOME" = success
          test "$RW_UNLOCK_OUTCOME" = success
