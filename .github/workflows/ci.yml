name: Pull Request Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-and-sdk:
    name: Compiler and SDK (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake curl ninja-build lsb-release software-properties-common
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure and build SDK
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${LLVM_DIR:+-DLLVM_DIR="$LLVM_DIR"} \
            ${LLD_DIR:+-DLLD_DIR="$LLD_DIR"} \
            ${ZSTD_LIBRARY:+-DZSTD_LIBRARY="$ZSTD_LIBRARY"} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}
          cmake --build build --parallel 2

      - name: Verify developer experience
        run: |
          python3 tools/scripts/test_developer_experience.py
          python3 tools/scripts/test_ai_tooling.py
          python3 tools/scripts/test_ai_completion_card.py
          python3 tools/scripts/test_json_cli_contract.py
          python3 tools/scripts/evaluate_ai_coding.py
          python3 tools/scripts/test_semantic_index.py
          python3 tools/scripts/test_cede_obligation_evidence.py
          python3 tools/scripts/test_taskhandle_lifecycle.py
          python3 tools/scripts/test_capability_pilot.py
          python3 tools/scripts/test_semantic_diff_preview.py
          python3 tools/scripts/test_lsp_protocol.py

      - name: Build GUI settings dogfood
        if: runner.os == 'macOS'
        working-directory: demos/gui-settings
        env:
          TOKA_LIB: ../../lib
          TOKA_OFFLINE: "1"
        run: ../../build/bin/toka build

      - name: Qualify persistent tooling at scale
        run: python3 tools/scripts/test_tooling_scale.py

      - name: Run Toka 1.0 Discovery Conformance Suite
        run: |
          set -o pipefail
          python3 tools/run_conformance.py 2>&1 | tee build/conformance.log

      - name: Verify no-OpenSSL runtime profile
        run: |
          set -o pipefail
          ./tools/test_no_openssl.sh 2>&1 | tee build/no-openssl.log

      - name: Upload failed qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-diagnostics-${{ matrix.name }}
          path: |
            build/conformance.log
            build/no-openssl.log
          if-no-files-found: ignore

      - name: Build ASan runtime profile
        run: ./tools/build_sanitized.sh runtime-asan

      - name: Run compiler regression suites
        env:
          CORES: "2"
        run: |
          set -euo pipefail
          python3 tools/scripts/test_pass.py --exclude-file spec/ci_quarantined_pass_tests.list
          python3 tools/scripts/test_verify_fail.py --exclude-file spec/ci_quarantined_fail_tests.list
          python3 tools/scripts/test_verify_warn.py
          tools/scripts/test_semantic_replay.sh
          tools/scripts/test_mixed_core_cache.sh

      - name: Qualify Redis real service (Linux loopback runner)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python3 tools/scripts/qualify_redis_real.py \
            --tokac build/bin/tokac \
            --report build/redis-real-service.json

      - name: Upload Redis real-service evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: redis-real-service
          path: build/redis-real-service.json
          if-no-files-found: error
