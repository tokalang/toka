name: Diagnose 0.11 CI gate fixes

# Isolated diagnostics. No qualification, release or promotion job.
on:
  push:
    branches: [fixes/0.11-ci-gates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-sanitizer:
    name: Diagnose exact candidate Linux x64 sanitizer
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 20 and debugger
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake curl ninja-build lsb-release software-properties-common gdb
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=/usr/lib/llvm-20/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-20/bin/clang++" >> "$GITHUB_ENV"
      - name: Build exact candidate with formal sanitizer flags
        run: |
          set -euo pipefail
          mkdir -p diagnosis
          {
            echo "qualification=false"
            echo "candidate_sha=$GITHUB_SHA"
            git rev-parse HEAD
            clang --version
            llvm-config --version
            uname -a
          } > diagnosis/identity.txt
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm -DLLD_DIR=/usr/lib/llvm-20/lib/cmake/lld \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr" \
            2>&1 | tee diagnosis/configure.log
          cmake --build build-asan --target tokac --parallel 2 2>&1 | tee diagnosis/build.log
          python3 tools/scripts/test_pass.py --prepare-runtime-only
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum build-asan/bin/tokac lib/sys/toka_rt.o >> diagnosis/identity.txt
          cp build-asan/CMakeCache.txt diagnosis/
      - name: Execute complete reliability audit with retained crash diagnostics
        env:
          ASAN_SYMBOLIZER_PATH: /usr/lib/llvm-20/bin/llvm-symbolizer
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -euo pipefail
          export TOKA_LIB="$PWD/lib"
          python3 tools/scripts/test_fz3_diagnostics.py
          python3 tools/scripts/audit_fz3_reliability.py --tokac build-asan/bin/tokac \
            --timeout 30 --output diagnosis/audit.json --diagnostics-dir diagnosis/fz3 \
            2>&1 | tee diagnosis/audit.log
      - name: Upload Linux diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0.11-linux-x64-sanitizer-diagnostic
          path: diagnosis/
          if-no-files-found: error

  windows-dogfood:
    name: Exercise patched Windows SDK with LLVM 22
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git mingw-w64-x86_64-clang mingw-w64-x86_64-cmake
            mingw-w64-x86_64-lld mingw-w64-x86_64-llvm mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl mingw-w64-x86_64-python mingw-w64-x86_64-zstd
      - name: Record identity and build patched SDK
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          mkdir -p build/diagnosis
          {
            echo "qualification=false"
            echo "driver_sha=$GITHUB_SHA"
            git rev-parse HEAD
            llvm-config --version
            clang --version
          } > build/diagnosis/identity.txt
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/mingw64/lib/cmake/llvm -DLLD_DIR=/mingw64/lib/cmake/lld
          cmake --build build --parallel 2
          shasum -a 256 build/bin/tokac.exe >> build/diagnosis/identity.txt
      - name: Run existing installed SDK dogfood and cancellation assertions
        run: |
          set -euo pipefail
          export TOKA_LIB="$PWD/lib"
          python3 tools/scripts/test_pass.py --prepare-runtime-only
          python3 tools/scripts/test_developer_experience.py | tee build/diagnosis/windows-dogfood.json
          ctest --test-dir build --output-on-failure -R "^toka_async_" | tee build/diagnosis/async.log
          python3 tools/scripts/test_windows_sync_storage.py 2>&1 | tee build/diagnosis/windows-sync-storage.log
          python3 tools/scripts/test_native_sync_factory_plans.py --build-dir build 2>&1 | tee build/diagnosis/native-factory.log
          python3 tools/scripts/test_taskhandle_lifecycle.py --conformance-output build/diagnosis/taskhandle.json 2>&1 | tee build/diagnosis/taskhandle.log
          git -c core.fsmonitor=false status --porcelain > build/diagnosis/source-status-before.txt
          python3 tools/scripts/test_restricted_cancellation_profile.py \
            --candidate-sha "$GITHUB_SHA" --conformance-output build/diagnosis/restricted-cancellation.json \
            2>&1 | tee build/diagnosis/restricted-cancellation.log
      - name: Upload Windows diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0.11-windows-dogfood-diagnostic
          path: build/diagnosis/
          if-no-files-found: warn
